{% extends 'base.html' %}

{% block title %}Удаление документа | BorderFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-3">Удалить документ?</h2>
                <p class="text-muted mb-4">
                    <strong>{{ document.title }}</strong>
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'shipment_documents' document.shipment.id %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
