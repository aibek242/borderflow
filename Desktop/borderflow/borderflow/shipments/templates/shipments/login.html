{% extends 'base.html' %}

{% block title %}Вход | BorderFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-4">Вход в BorderFlow</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-dark w-100">Войти</button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'register' %}">Нет аккаунта? Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
