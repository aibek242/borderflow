{% extends 'base.html' %}

{% block title %}Загрузка документа | BorderFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-4">Загрузить документ</h2>
                <p class="text-muted">{{ shipment.title }}</p>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Тип документа</label>
                        {{ form.document_type }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Файл</label>
                        {{ form.file }}
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-dark">Загрузить</button>
                        <a href="{% url 'shipment_documents' shipment.id %}" class="btn btn-outline-secondary">Назад</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
